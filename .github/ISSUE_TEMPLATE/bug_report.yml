name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version & platform
      placeholder: "1.8.x on macOS / Windows / iOS / Android"
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open the developer console (Ctrl/Cmd+Shift+I) and paste any red errors that mention "Identity Tracker".
      render: text
